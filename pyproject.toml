[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-statements-prototype"
version = "0.1.0"
description = "Local prototype for mathematical statement syntax and LaTeX rendering"
requires-python = ">=3.10"

[project.optional-dependencies]
parser = ["lark==1.3.1", "interegular==0.3.3"]
bibtex = ["pybtex==0.26.1"]

[tool.setuptools]
packages = ["cleanlang", "cleanlang.joint_inference"]

